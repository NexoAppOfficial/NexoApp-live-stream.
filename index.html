<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>NexoApp Live Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100vw;
      height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 18px;
      color: #a0a0a0;
    }
    #error-box {
      padding: 30px;
      color: #ff5252;
    }
    #error-box h3 { margin-bottom: 10px; }
    #error-box pre {
      background: #111;
      padding: 15px;
      border-radius: 6px;
      color: #fff;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>

  <!-- Load local SDK file from your own repo -->
  <script src="./zego-uikit-prebuilt.js"></script>
</head>
<body>
  <div id="root">
    <div id="loading">Starting NexoApp Live Test...</div>
  </div>

  <script>
    "use strict";

    window.addEventListener("load", async function() {
      try {
        if (!window.ZegoUIKitPrebuilt) {
          throw new Error("Local zego-uikit-prebuilt.js file was not found or failed to parse.");
        }

        const kitToken = "04AAAAAGrWkNkADBsgIJKtYnNhZKxjzQCwhcyGVbwSabMjqOevS9nW+DqVL6CFL9V41GBJ1Z1ALb7r0jUDDXgvXCH+vqnCNKc+vGDCnCduP/sGhHcO6XA3Ldoz1n91jAKElWfnBoOT6mo+0KWvem2/VEqlSUvjseRRJt+qIuBqY5UZAABLy4VqGHtQZKraVbzNHPyhHrT6nOnCSjA67F12T4eBCQN1caT8dnS4pugGs6W2ry4o83SD3UO7T90bN6oudqhRNHtlINIB";

        const params = new URLSearchParams(window.location.search);
        const roleParam = (params.get("role") || "Host").toLowerCase();
        const role = roleParam === "audience" ? ZegoUIKitPrebuilt.Audience : ZegoUIKitPrebuilt.Host;

        const zp = ZegoUIKitPrebuilt.create(kitToken);

        const rootElement = document.getElementById("root");
        rootElement.innerHTML = "";

        await zp.joinRoom({
          container: rootElement,
          scenario: {
            mode: ZegoUIKitPrebuilt.LiveStreaming,
            config: { role: role }
          },
          showPreJoinView: false,
          turnOnCameraWhenJoining: role === ZegoUIKitPrebuilt.Host,
          turnOnMicrophoneWhenJoining: role === ZegoUIKitPrebuilt.Host,
          showMyCameraToggleButton: true,
          showMyMicrophoneToggleButton: true,
          onJoinRoom: () => {
            console.log("Successfully joined live stream!");
          },
          onLeaveRoom: () => {
            console.log("Left room.");
          }
        });

      } catch (error) {
        console.error("Test error:", error);
        document.getElementById("root").innerHTML = `
          <div id="error-box">
            <h3>Test Error</h3>
            <pre>${error.message || error}</pre>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
