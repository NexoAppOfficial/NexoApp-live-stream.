<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXO Live Streaming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
    <script>
        function getUrlParams(url) {
            let urlStr = url.split('?')[1];
            if (!urlStr) return {};
            return Object.fromEntries(new URLSearchParams(urlStr).entries());
        }

        const appID = 747640475;
        const serverSecret = "f043619bceef40c26c0c3b46432eca06";

        const roomID = getUrlParams(window.location.href)['roomID'] || "nexo_test_room";
        const userID = Math.floor(Math.random() * 10000) + "";
        const userName = "User_" + userID;

        const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
            appID, serverSecret, roomID, userID, userName
        );

        const roleParam = getUrlParams(window.location.href)['role'] || 'Host';
        const role = roleParam === 'Host' ? ZegoUIKitPrebuilt.Host : ZegoUIKitPrebuilt.Audience;

        const zp = ZegoUIKitPrebuilt.create(kitToken);

        // Different config for Host and Audience to avoid the error
        const joinConfig = {
            container: document.querySelector("#root"),
            scenario: {
                mode: ZegoUIKitPrebuilt.LiveStreaming,
                config: {
                    role: role
                }
            },
            sharedLinks: [{
                name: 'Join as Audience',
                url: 'https://nexoappofficial.github.io/nexo-live-stream./?roomID=' + roomID + '&role=Audience'
            }],
            showTextChat: true,
            showUserList: true
        };

        // Only show these buttons for Host
        if (role === ZegoUIKitPrebuilt.Host) {
            joinConfig.showScreenSharingButton = true;
        }

        zp.joinRoom(joinConfig);
    </script>
</body>
</html>
