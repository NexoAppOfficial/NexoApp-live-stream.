<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoApp Test Live</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #000000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
    #error { padding: 30px; color: #ff5252; white-space: pre-wrap; word-break: break-word; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@zegocloud/zego-uikit-prebuilt@2.17.3/zego-uikit-prebuilt.js"></script>
</head>
<body>
  <div id="root"><p style="padding:20px; color:#aaa;">Loading test room...</p></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    
    // Pull configuration straight from the URL parameters
    const appId = Number(params.get("appID") || 747640475);
    const serverSecret = params.get("secret");
    const roomID = params.get("roomID") || "nexo_test_room";
    const userID = params.get("userID") || "user_" + Math.floor(Math.random() * 1000);
    const userName = params.get("userName") || "Nexo Tester";
    const isHost = (params.get("role") || "host").toLowerCase() === "host";

    function showError(msg) {
      document.getElementById("root").innerHTML = `<div id="error"><h3>Test Setup Error</h3><pre>${msg}</pre></div>`;
    }

    try {
      if (!serverSecret) {
        throw new Error("Missing Server Secret!\n\nPass it in your URL like this:\n?secret=YOUR_SERVER_SECRET&roomID=room123");
      }

      // Generate test token dynamically on the fly
      const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
        appId,
        serverSecret,
        roomID,
        userID,
        userName
      );

      const zp = ZegoUIKitPrebuilt.create(kitToken);
      document.getElementById("root").innerHTML = "";

      zp.joinRoom({
        container: document.querySelector("#root"),
        scenario: {
          mode: ZegoUIKitPrebuilt.LiveStreaming,
          config: { role: isHost ? ZegoUIKitPrebuilt.Host : ZegoUIKitPrebuilt.Audience }
        },
        showPreJoinView: false,
        turnOnCameraWhenJoining: isHost,
        turnOnMicrophoneWhenJoining: isHost,
        onLeaveRoom: () => {
          if (window.AppInventor) {
            window.AppInventor.setWebViewString("CALL_ENDED");
          }
        }
      });
    } catch (err) {
      showError(err.message || String(err));
    }
  </script>
</body>
</html>
