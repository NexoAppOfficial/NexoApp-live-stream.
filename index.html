
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171321">

  <title>NexoApp Live</title>

  <style>
    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #171321;
      font-family: Arial, sans-serif;
    }

    #status {
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="root">
    <p id="status">Loading NexoApp Live...</p>
  </div>

  <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

  <script>
    // =====================================
    // NEXOAPP LIVE CONFIGURATION
    // =====================================

    const params = new URLSearchParams(
      window.location.search
    );

    // User identity used to generate this Kit Token
    const userID = "nexo_live_test";
    const userName = "Olaniyi Olaleye"

    // Default live room
    const roomID =
      params.get("roomID") || "nexo_live_room_01";

    // Host or Audience
    const roleName =
      params.get("role") || "Host";

    // Your newly generated temporary Kit Token
    const kitToken =
      "04AAAAAGrVpoEADCfh1N8g0alUc2vU3QC5H8UDs2eYZAjh9IPZB3EX3o6+gyezB77fwo2uxB6EFJdc1eUmsgV8jAl2yIat7hyyzz+lRPq1ue0MVDxUsYOF5InHrOdkhRSM26FrS5JrQgUOBBBLpgHtCH1HhPa7LyVz+qgf7UoJCAUTEqQXvWa90Em0k5Nyn0QPkNcKRsTiKAqV/mXc5ONtRUeAB2OdEE6AWbCiRKWonObSglGuk5U2Wy78lF0x//PsKMSAJoznsnVVziFv5gHZyn8B";

    // =====================================
    // START LIVE STREAMING
    // =====================================

    async function startNexoLive() {
      const root = document.getElementById("root");

      try {
        // Check that the ZEGOCLOUD SDK loaded
        if (!window.ZegoUIKitPrebuilt) {
          throw new Error(
            "ZEGOCLOUD SDK did not load. Check your internet connection."
          );
        }

        // Check token configuration
        if (
          !kitToken ||
          kitToken === "PASTE_YOUR_NEW_KIT_TOKEN_HERE"
        ) {
          throw new Error(
            "Kit Token is missing. Add your generated token."
          );
        }

        // Create the ZEGOCLOUD UIKit instance
        const zp = ZegoUIKitPrebuilt.create(kitToken);

        // Choose Host or Audience
        const role =
          roleName.toLowerCase() === "audience"
            ? ZegoUIKitPrebuilt.Audience
            : ZegoUIKitPrebuilt.Host;

        // Link for viewers to join this room
        const audienceURL =
          window.location.origin +
          window.location.pathname +
          "?roomID=" +
          encodeURIComponent(roomID) +
          "&role=Audience";

        // Join the live room
        await zp.joinRoom({
          container: root,

          scenario: {
            mode: ZegoUIKitPrebuilt.LiveStreaming,
            config: {
              role: role
            }
          },

          showPreJoinView: true,

          turnOnCameraWhenJoining:
            roleName.toLowerCase() !== "audience",

          turnOnMicrophoneWhenJoining:
            roleName.toLowerCase() !== "audience",

          sharedLinks: [
            {
              name: "Watch this live",
              url: audienceURL
            }
          ]
        });

      } 
} catch (error) {
  console.error("NexoApp Live error:", error);

  const root = document.getElementById("root");
  root.innerHTML = "";

  const errorMessage = document.createElement("p");
  errorMessage.style.cssText =
    "color:white;padding:20px;font-family:Arial;overflow-wrap:anywhere;";

  errorMessage.textContent =
    "NexoApp Live error: " +
    (error && error.message
      ? error.message
      : String(error));

  root.appendChild(errorMessage);
}
      }
    }

    // Run the application
    startNexoLive();
  </script>
</body>
</html>
