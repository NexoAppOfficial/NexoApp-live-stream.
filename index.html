<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>NexoApp Live Test</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100vw; height: 100vh; background-color: #000000; color: #ffffff; font-family: Arial, sans-serif; overflow: hidden; }
    #status { padding: 30px; text-align: center; color: #a0a0a0; font-size: 16px; }
    #error-container { padding: 30px; color: #ff5252; }
    #error-container h3 { margin-bottom: 12px; }
    #error-container pre { background: #1e1e1e; padding: 16px; border-radius: 8px; color: #ffffff; white-space: pre-wrap; word-break: break-word; }
  </style>

  <!-- Primary CDN: UNPKG Official ZEGOCLOUD SDK -->
  <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

  <!-- Fallback CDN: jsDelivr (if unpkg fails to load on mobile network) -->
  <script>
    if (!window.ZegoUIKitPrebuilt) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"><\/script>');
    }
  </script>
</head>

<body>
  <div id="root">
    <p id="status">Connecting to NexoApp Live engine...</p>
  </div>

  <script>
    "use strict";

    // Embedded test credentials
    const TEST_TOKEN = "04AAAAAGrWkNkADBsgIJKtYnNhZKxjzQCwhcyGVbwSabMjqOevS9nW+DqVL6CFL9V41GBJ1Z1ALb7r0jUDDXgvXCH+vqnCNKc+vGDCnCduP/sGhHcO6XA3Ldoz1n91jAKElWfnBoOT6mo+0KWvem2/VEqlSUvjseRRJt+qIuBqY5UZAABLy4VqGHtQZKraVbzNHPyhHrT6nOnCSjA67F12T4eBCQN1caT8dnS4pugGs6W2ry4o83SD3UO7T90bN6oudqhRNHtlINIB";

    function showError(title, message) {
      document.getElementById("root").innerHTML = `
        <div id="error-container">
          <h3>${title}</h3>
          <pre>${message}</pre>
        </div>
      `;
    }

    async function startLiveStream() {
      try {
        if (!window.ZegoUIKitPrebuilt) {
          throw new Error("SDK Load Failed: Could not load ZEGOCLOUD libraries from unpkg or jsDelivr. Please check your mobile data or Wi-Fi connection.");
        }

        const params = new URLSearchParams(window.location.search);
        const kitToken = params.get("token") || TEST_TOKEN;
        const roleParam = (params.get("role") || "Host").toLowerCase();

        const isHost = roleParam === "host";
        const role = isHost ? ZegoUIKitPrebuilt.Host : ZegoUIKitPrebuilt.Audience;

        const zp = ZegoUIKitPrebuilt.create(kitToken);
        document.getElementById("root").innerHTML = "";

        await zp.joinRoom({
          container: document.getElementById("root"),
          scenario: {
            mode: ZegoUIKitPrebuilt.LiveStreaming,
            config: { role: role }
          },
          showPreJoinView: false,
          turnOnCameraWhenJoining: isHost,
          turnOnMicrophoneWhenJoining: isHost,
          showMyCameraToggleButton: isHost,
          showMyMicrophoneToggleButton: isHost,
          onJoinRoom: () => {
            console.log("Joined room successfully as:", isHost ? "Host" : "Audience");
          },
          onLeaveRoom: () => {
            console.log("Left live stream room.");
          }
        });

      } catch (err) {
        showError("Connection Error", err.message || String(err));
      }
    }

    window.addEventListener("load", startLiveStream);
  </script>
</body>
</html>
