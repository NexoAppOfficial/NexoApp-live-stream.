
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>NEXO Live Streaming</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        #status {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #000;
            text-align: center;
            line-height: 1.6;
        }

        #status.hidden {
            display: none;
        }

        #statusContent {
            max-width: 420px;
        }

        #status h2 {
            color: #a78bfa;
            margin-bottom: 12px;
        }

        #status p {
            color: #ddd;
            overflow-wrap: anywhere;
        }

        #retryButton {
            margin-top: 18px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <div id="status">
        <div id="statusContent">
            <h2>NEXO Live</h2>

            <p id="statusMessage">
                Loading livestream...
            </p>

            <button id="retryButton" hidden>
                Try Again
            </button>
        </div>
    </div>

    <!-- Zego UIKit -->
    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

    <script>
        // =====================================
        // NEXO LIVE CONFIGURATION
        // =====================================

        const appID = 747640475;

        // Your user identity
        const userID = "Olaniyi";
        const userName = "Olaniyi";

        /*
         * SECURITY:
         * Do not put your Zego Server Secret in this file.
         *
         * A temporary token must be generated or supplied
         * in the format supported by your Zego integration.
         *
         * For production, obtain a valid Kit Token from
         * your secure backend.
         */

        // =====================================
        // PAGE ELEMENTS
        // =====================================

        const root = document.getElementById("root");
        const statusBox = document.getElementById("status");
        const statusMessage =
            document.getElementById("statusMessage");
        const retryButton =
            document.getElementById("retryButton");

        function showStatus(message, showRetry = false) {
            statusBox.classList.remove("hidden");
            statusMessage.textContent = message;
            retryButton.hidden = !showRetry;
        }

        function hideStatus() {
            statusBox.classList.add("hidden");
        }

        retryButton.addEventListener("click", function () {
            location.reload();
        });

        // =====================================
        // ROOM AND ROLE
        // =====================================

        const params = new URLSearchParams(
            window.location.search
        );

        const roomID =
            params.get("roomID") || "nexo_test_room";

        const requestedRole = (
            params.get("role") || "Host"
        ).toLowerCase();

        const isAudience = requestedRole === "audience";

        // =====================================
        // START LIVESTREAM
        // =====================================

        async function startLiveStream() {
            try {
                if (!Number.isInteger(appID) || appID <= 0) {
                    throw new Error("Invalid Zego App ID.");
                }

                if (!roomID.trim()) {
                    throw new Error("Room ID is missing.");
                }

                if (
                    typeof ZegoUIKitPrebuilt === "undefined"
                ) {
                    throw new Error(
                        "Zego UIKit failed to load. Check your internet connection."
                    );
                }

                showStatus(
                    isAudience
                        ? "Joining NEXO livestream..."
                        : "Starting NEXO livestream..."
                );

                /*
                 * A valid Zego Kit Token is required here.
                 *
                 * Do not pass an unknown temporary token into
                 * generateKitTokenForTest().
                 *
                 * Connect this section to your secure token
                 * generation endpoint before joining the room.
                 */

                throw new Error(
                    "A valid Zego Kit Token is required. Connect your temporary token or secure token endpoint before joining."
                );

            } catch (error) {
                console.error(
                    "NEXO livestream error:",
                    error
                );

                showStatus(
                    "Unable to start NEXO Live. " +
                    (error.message || "Please try again."),
                    true
                );
            }
        }

        // =====================================
        // START
        // =====================================

        startLiveStream();
    </script>

</body>
</html>
