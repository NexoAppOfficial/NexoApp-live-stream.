
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171321">
  <title>NexoApp Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #171321;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    #root {
      height: 100dvh;
      min-height: 100%;
      overflow: hidden;
    }

    #status {
      padding: 20px;
      color: #ffffff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div id="root">
    <p id="status">Loading NexoApp Live...</p>
  </div>

  <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

  <script>
    "use strict";

    // =====================================
    // NEXOAPP LIVE CONFIGURATION
    // =====================================

    const APP_ID = 747640475;

    const USER_ID = "Olaniyi Olaleye"

 const USER_NAME = "Olaniyi Olaleye";

    const params = new URLSearchParams(
      window.location.search
    );

    const ROOM_ID =
      params.get("roomID") || "nexo_live_room_01";

    const ROLE_NAME =
      params.get("role") || "Host";

    // Your newly generated ZEGOCLOUD Kit Token
    const KIT_TOKEN =
      "04AAAAAGrVpoEADCfh1N8g0alUc2vU3QC5H8UDs2eYZAjh9IPZB3EX3o6+gyezB77fwo2uxB6EFJdc1eUmsgV8jAl2yIat7hyyzz+lRPq1ue0MVDxUsYOF5InHrOdkhRSM26FrS5JrQgUOBBBLpgHtCH1HhPa7LyVz+qgf7UoJCAUTEqQXvWa90Em0k5Nyn0QPkNcKRsTiKAqV/mXc5ONtRUeAB2OdEE6AWbCiRKWonObSglGuk5U2Wy78lF0x//PsKMSAJoznsnVVziFv5gHZyn8B";

    // =====================================
    // DISPLAY ERRORS
    // =====================================

    function showError(title, details) {
      const root = document.getElementById("root");
      root.replaceChildren();

      const heading = document.createElement("h3");
      heading.textContent = title;

      const message = document.createElement("pre");
      message.style.cssText =
        "padding:20px;white-space:pre-wrap;" +
        "overflow-wrap:anywhere;color:white;";
      message.textContent = details;

      root.append(heading, message);
    }

    // =====================================
    // START LIVE STREAMING
    // =====================================

    async function startNexoLive() {
      try {
        if (!window.ZegoUIKitPrebuilt) {
          throw new Error(
            "ZEGOCLOUD SDK failed to load. Check your internet connection."
          );
        }

        if (!KIT_TOKEN) {
          throw new Error(
            "The ZEGOCLOUD Kit Token is missing."
          );
        }

        // Select the participant role
        const role =
          ROLE_NAME.toLowerCase() === "audience"
            ? ZegoUIKitPrebuilt.Audience
            : ZegoUIKitPrebuilt.Host;

        // Initialize UIKit with the Kit Token
        const zp = ZegoUIKitPrebuilt.create(KIT_TOKEN);

        // Shareable audience link for the same room
        const audienceURL =
          window.location.origin +
          window.location.pathname +
          "?roomID=" +
          encodeURIComponent(ROOM_ID) +
          "&role=Audience";

        const root = document.getElementById("root");
        root.replaceChildren();

        await zp.joinRoom({
          container: root,

          scenario: {
            mode: ZegoUIKitPrebuilt.LiveStreaming,
            config: {
              role: role
            }
          },

          showPreJoinView: true,

          turnOnCameraWhenJoining:
            role === ZegoUIKitPrebuilt.Host,

          turnOnMicrophoneWhenJoining:
            role === ZegoUIKitPrebuilt.Host,

          sharedLinks: [
            {
              name: "Watch this live",
              url: audienceURL
            }
          ],

          onJoinRoom: function () {
            console.log(
              "NexoApp Live joined:",
              ROOM_ID
            );
          },

          onLeaveRoom: function () {
            console.log("NexoApp Live ended.");
          }
        });

      } catch (error) {
        console.error("NexoApp Live error:", error);

        showError(
          "NexoApp Live could not start",
          error && error.stack
            ? error.stack
            : String(error)
        );
      }
    }

    // Wait for the page to finish loading
    window.addEventListener("load", startNexoLive);
  </script>
</body>
</html>
