<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXO Live Streaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body, #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
    <script>
        function getUrlParams(url) {
            const urlStr = url.split('?')[1];
            if (!urlStr) return {};
            return Object.fromEntries(new URLSearchParams(urlStr).entries());
        }

        // ========== Your Credentials ==========
        const appID = 747640475;
        const serverSecret = "f043619bceef40c26c0c3b46432eca06";
        // =====================================

        const roomID = getUrlParams(window.location.href)['roomID'] || "nexo_test_room";
        const userID = Math.floor(Math.random() * 10000) + "";
        const userName = "User_" + userID;

        const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
            appID,
            serverSecret,
            roomID,
            userID,
            userName
        );

        // Better role handling
        const roleParam = (getUrlParams(window.location.href)['role'] || 'Host').toLowerCase();
        const role = roleParam === 'audience' 
            ? ZegoUIKitPrebuilt.Audience 
            : ZegoUIKitPrebuilt.Host;

        const zp = ZegoUIKitPrebuilt.create(kitToken);

        zp.joinRoom({
            container: document.querySelector("#root"),
            scenario: {
                mode: ZegoUIKitPrebuilt.LiveStreaming,
                config: {
                    role: role,
                },
            },
            // Correct share link (uses current URL automatically)
            sharedLinks: [{
                name: 'Join as Audience',
                url: window.location.origin + window.location.pathname + 
                     '?roomID=' + roomID + '&role=Audience'
            }],
            showScreenSharingButton: true,
            showTextChat: true,
            showUserList: true,
            showDuration: true,           // Show live time
            maxDuration: 0,               // No time limit
            turnOnMicrophoneWhenJoining: role === ZegoUIKitPrebuilt.Host,
            turnOnCameraWhenJoining: role === ZegoUIKitPrebuilt.Host,
        });
    </script>
</body>
</html>
