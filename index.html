<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoApp Quick Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100vw;
      height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 18px;
      color: #a0a0a0;
    }
    #error-box {
      padding: 30px;
      color: #ff5252;
    }
    #error-box h3 { margin-bottom: 10px; }
    #error-box pre {
      background: #111;
      padding: 15px;
      border-radius: 6px;
      color: #fff;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">Loading NexoApp Live engine...</div>
  </div>

  <!-- Dynamic Loader with Fallback CDN -->
  <script>
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function initializeZegoSDK() {
      // Primary CDN: jsDelivr
      try {
        await loadScript("https://cdn.jsdelivr.net/npm/@zegocloud/zego-uikit-prebuilt@2.17.3/zego-uikit-prebuilt.js");
      } catch (e1) {
        console.warn("jsDelivr CDN failed, falling back to unpkg...");
        // Fallback CDN: unpkg
        try {
          await loadScript("https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js");
        } catch (e2) {
          throw new Error("Unable to load ZEGOCLOUD SDK libraries from primary or backup CDNs. Please check your network connection.");
        }
      }
    }

    window.addEventListener("load", async function() {
      try {
        // Load the SDK dynamically first
        await initializeZegoSDK();

        if (!window.ZegoUIKitPrebuilt) {
          throw new Error("ZegoUIKitPrebuilt object failed to initialize.");
        }

        // Active test token
        const kitToken = "04AAAAAGrWkNkADBsgIJKtYnNhZKxjzQCwhcyGVbwSabMjqOevS9nW+DqVL6CFL9V41GBJ1Z1ALb7r0jUDDXgvXCH+vqnCNKc+vGDCnCduP/sGhHcO6XA3Ldoz1n91jAKElWfnBoOT6mo+0KWvem2/VEqlSUvjseRRJt+qIuBqY5UZAABLy4VqGHtQZKraVbzNHPyhHrT6nOnCSjA67F12T4eBCQN1caT8dnS4pugGs6W2ry4o83SD3UO7T90bN6oudqhRNHtlINIB";

        const params = new URLSearchParams(window.location.search);
        const roleParam = (params.get("role") || "Host").toLowerCase();
        const role = roleParam === "audience" ? ZegoUIKitPrebuilt.Audience : ZegoUIKitPrebuilt.Host;

        const zp = ZegoUIKitPrebuilt.create(kitToken);

        const rootElement = document.getElementById("root");
        rootElement.innerHTML = "";

        await zp.joinRoom({
          container: rootElement,
          scenario: {
            mode: ZegoUIKitPrebuilt.LiveStreaming,
            config: { role: role }
          },
          showPreJoinView: false,
          turnOnCameraWhenJoining: role === ZegoUIKitPrebuilt.Host,
          turnOnMicrophoneWhenJoining: role === ZegoUIKitPrebuilt.Host,
          showMyCameraToggleButton: true,
          showMyMicrophoneToggleButton: true,
          onJoinRoom: () => {
            console.log("Successfully joined the live stream room!");
          },
          onLeaveRoom: () => {
            console.log("Left the room.");
          }
        });

      } catch (error) {
        console.error("Test failed:", error);
        document.getElementById("root").innerHTML = `
          <div id="error-box">
            <h3>Test Error</h3>
            <pre>${error.message || error}</pre>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
